<div class="grid grid-cols-1 lg:grid-cols-2 gap-5 items-center">
  <!-- Columna izquierda: formulario -->
  <div class="flex flex-col w-full">
    <h1 class="text-3xl font-bold text-white mb-6">
      Registro de tipo de documento
    </h1>

    <document-type-form
      class="w-full  rounded-xl shadow-md"
      [documentType]="documentToEdit"
      (onSubmitForm)="onFormSubmitted()"
    ></document-type-form>
  </div>

  <!-- Columna derecha: imagen -->
  <div class="flex justify-center items-center">
    <img
      src="./images/image1.webp"
      alt="Ilustración ecológica"
      class="max-w-md w-full h-auto rounded-xl object-contain"
    />
  </div>

  <!-- Fila completa: lista de tipos -->
  <div class="col-span-1 lg:col-span-2 ">
    <list-type-document
      (editDocumentType)="onEditDocumentType($event)"
      (reloadComponent)="reloadList()"
      [documentType]="documentType()"
    ></list-type-document>
  </div>
</div>
