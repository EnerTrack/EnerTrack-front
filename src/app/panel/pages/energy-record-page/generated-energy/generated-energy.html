<section class="flex flex-col justify-start items-center bg-gray-900 rounded-lg p-3 w-full h-full">
  <form class="grid gap-6 sm:grid-cols-2">

    <!-- País -->
    <div>
      <label for="country" class="block mb-2 text-sm font-medium text-gray-300">País</label>
      <select
        id="country"
        name="country"
        required
        class="bg-gray-800 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5"
      >
        <option value="" disabled selected>Seleccione un país</option>
        <option value="Colombia">Colombia</option>
        <option value="México">México</option>
        <option value="Brasil">Brasil</option>
        <option value="Canadá">Canadá</option>
        <option value="Argentina">Argentina</option>
        <option value="Chile">Chile</option>
      </select>
    </div>

    <!-- Año -->
    <div>
      <label for="year" class="block mb-2 text-sm font-medium text-gray-300">Año</label>
      <input
        type="number"
        id="year"
        name="year"
        min="1900"
        max="2100"
        placeholder="Ingrese el año"
        required
        class="bg-gray-800 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5"
      />
    </div>

    <!-- Energía Generada (MWh) -->
    <div>
      <label for="generatedMwh" class="block mb-2 text-sm font-medium text-gray-300">Energía Generada (MWh)</label>
      <input
        type="number"
        id="generatedMwh"
        name="generatedMwh"
        min="0"
        step="0.01"
        placeholder="Ingrese energía generada"
        required
        class="bg-gray-800 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5"
      />
    </div>

    <!-- Capacidad (MWh) -->
    <div>
      <label for="capacityMwh" class="block mb-2 text-sm font-medium text-gray-300">Capacidad (MWh)</label>
      <input
        type="number"
        id="capacityMwh"
        name="capacityMwh"
        min="0"
        step="0.01"
        placeholder="Ingrese capacidad"
        required
        class="bg-gray-800 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5"
      />
    </div>

    <!-- Reducción de Emisiones -->
    <div>
      <label for="emissionReductionTons" class="block mb-2 text-sm font-medium text-gray-300">Reducción de Emisiones (toneladas)</label>
      <input
        type="number"
        id="emissionReductionTons"
        name="emissionReductionTons"
        min="0"
        step="0.01"
        placeholder="Ingrese reducción de emisiones"
        class="bg-gray-800 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5"
      />
    </div>

    <!-- Inversión -->
    <div>
      <label for="investmentUsd" class="block mb-2 text-sm font-medium text-gray-300">Inversión (USD)</label>
      <input
        type="number"
        id="investmentUsd"
        name="investmentUsd"
        min="0"
        step="0.01"
        placeholder="Ingrese monto de inversión"
        class="bg-gray-800 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5"
      />
    </div>

    <!-- Valor Fuente -->
    <div>
      <label for="source" class="block mb-2 text-sm font-medium text-gray-300">Valor Fuente</label>
      <input
        type="number"
        id="source"
        name="source"
        step="0.01"
        placeholder="Ingrese valor fuente"
        required
        class="bg-gray-800 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5"
      />
    </div>

    <!-- Tipo de Energía -->
    <div>
      <label for="energyTypeName" class="block mb-2 text-sm font-medium text-gray-300">Tipo de Energía</label>
      <select
        id="energyTypeName"
        name="energyTypeName"
        required
        class="bg-gray-800 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5"
      >
        <option value="" disabled selected>Seleccione tipo de energía</option>
        <option value="Solar">Solar</option>
        <option value="Eólica">Eólica</option>
        <option value="Hidráulica">Hidráulica</option>
        <option value="Biomasa">Biomasa</option>
        <option value="Geotérmica">Geotérmica</option>
      </select>
    </div>

    <!-- ID Usuario -->
    <div class="sm:col-span-2">
      <label for="userId" class="block mb-2 text-sm font-medium text-gray-300">ID de Usuario</label>
      <input
        type="text"
        id="userId"
        name="userId"
        placeholder="Ingrese su ID de usuario"
        required
        class="bg-gray-800 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5"
      />
    </div>

    <!-- Botón -->
    <div class="sm:col-span-2 flex justify-end">
      <button
        type="button"
        class="text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:ring-green-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition"
      >
        Enviar Solicitud
      </button>
    </div>

  </form>
</section>
