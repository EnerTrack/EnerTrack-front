<div class="grid grid-cols-2 grid-rows-2 gap-2">

  <div class="flex flex-col w-full">
    <!-- Título -->
    <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-3">
      Registro de Energía Generada
    </h1>
    <!-- Formulario -->
    <energy-record-form
     class="w-full max-w-2xl"
     [energyRecord]="energyRecordToEdit"
     (onSubmitForm)="onFormSubmitted()"
    />
  </div>

    <div class="flex justify-center items-center">
    <img
      src="./images/image4.webp"
      alt="Ilustración ecológica"
      class="max-w-md w-full h-auto rounded-xl object-contain"
    />
  </div>

  <div
    class="col-span-2 row-start-2 mt-45 w-full h-[200px] flex flex-col justify-center rounded-lg shadow-md text-white"
  >

    <list-energy
    (editEnergyRecord)="onEditEnergyRecord($event)"
    (reloadComponent)="reloadList()"
    [energyRecord]="energyRecord()"
    />
  </div>
</div>
