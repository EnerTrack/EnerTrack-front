<section
  class="flex flex-col justify-start items-center bg-gray-900 rounded-lg p-5 w-full h-full"
>
  <form class="grid gap-6 sm:grid-cols-2 w-full max-w-2xl">
    <!-- Nombre del tipo de energía -->
    <div class="sm:col-span-2">
      <label
        for="energyTypeName"
        class="block mb-2 text-sm font-medium text-gray-300"
        >Nombre del Tipo de Energía</label
      >
      <input
        type="text"
        id="energyTypeName"
        name="energyTypeName"
        placeholder="Ej: Solar, Eólica, Hidráulica..."
        required
        class="bg-gray-800 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5"
      />
    </div>

    <div class="sm:col-span-2">
      <label
        for="status"
        class="block mb-2 text-sm font-medium text-gray-300"
        >Estatus</label
      >
      <select
        id="status"
        name="status"
        required
        class="bg-gray-800 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5"
      >
        <option value="" disabled selected>Seleccione un estatus</option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
        <option value="pendiente">Pendiente</option>
      </select>
    </div>

    <!-- Botón -->
    <div class="sm:col-span-2 flex justify-end">
      <button
        type="submit"
        class="text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:ring-green-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition"
      >
        Guardar Tipo de Energía
      </button>
    </div>
  </form>
</section>
