<aside
  id="logo-sidebar"
  class="fixed top-0 left-0 z-40 w-64 h-screen pt-20 transition-transform -translate-x-full sm:translate-x-0 bg-gray-900 border-gray-700"
>
  <div class="h-full px-3 pb-4 overflow-y-auto">
    <ul class="space-y-2 font-medium">
      @for (item of items; track $index) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="text-lime-400"
          class="flex items-center p-2 transition duration-200"
        >
          <span class="flex-1 ms-3 whitespace-nowrap">{{ item.label }}</span>

          @if (item.badge) {
          <span
            class="inline-flex items-center justify-center px-2 ms-3 text-sm font-medium rounded-full"
            [ngClass]="item.badgeColor"
          >
            {{ item.badge }}
          </span>
          }
        </a>
      </li>
      } @if (authService.authStatus() === 'authenticated') {

      <li>
        <button
          type="button"
          class="flex items-center w-full p-2 text-base text-gray-900 transition duration-75 rounded-lg group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700"
          data-collapse-toggle="dropdown-example"
        >
          <svg
            class="shrink-0 w-5 h-5 text-gray-500 transition duration-75 group-hover:text-gray-900 dark:text-gray-400 dark:group-hover:text-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 18 21"
          >
            <path
              d="M15 12a1 1 0 0 0 .962-.726l2-7A1 1 0 0 0 17 3H3.77L3.175.745A1 1 0 0 0 2.208 0H1a1 1 0 0 0 0 2h.438l.6 2.255v.019l2 7 .746 2.986A3 3 0 1 0 9 17a2.966 2.966 0 0 0-.184-1h2.368c-.118.32-.18.659-.184 1a3 3 0 1 0 3-3H6.78l-.5-2H15Z"
            />
          </svg>
          <span class="flex-1 ms-3 text-left rtl:text-right whitespace-nowrap">Admin</span>
          <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="m1 1 4 4 4-4"
            />
          </svg>
        </button>
        <ul id="dropdown-example" class="py-2 space-y-2">
          <li>
            <a
              [routerLink]="['energy']"
              routerLinkActive="text-lime-400"
              class="flex items-center w-full p-2 pl-11 grou"
            >
              Energía
            </a>
          </li>
          <li>
            <a
              [routerLink]="['energy-type']"
              routerLinkActive="text-lime-400"
              class="flex items-center w-full p-2 pl-11 grou"
            >
              Typo de energía
            </a>
          </li>
          <li>
            <a
              [routerLink]="['person']"
              routerLinkActive="text-lime-400"
              class="flex items-center w-full p-2 pl-11 grou"
            >
              Personas
            </a>
          </li>
          <li>
            <a
              [routerLink]="['document-type']"
              routerLinkActive="text-lime-400"
              class="flex items-center w-full p-2 pl-11 grou"
            >
              Tipos de documentos
            </a>
          </li>
        </ul>
      </li>

      }
    </ul>
  </div>
</aside>
