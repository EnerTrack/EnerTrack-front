<div class="card relative h-28 rounded-xl p-4!">
  <span class="text-gray-300 text-sm mb-2 font-medium">
    {{ countryData.country }}
  </span>

  <div class="flex gap-2.5">
    <div class="flex justify-between items-center w-full gap-1">
      <!-- Valor principal: emisión reducida -->
      <div class="flex justify-between gap-2">
        <p class="text-2xl font-semibold text-white">
          {{ countryData.emissionReductionTons | number: '1.2-2' }} t
        </p>
      </div>

      <!-- Badge de cambio porcentual -->
      <div
        class="flex items-center px-2 py-1 rounded-md text-sm font-medium"
        [ngClass]="{
          'bg-green-500/20 text-green-500': countryData.percentageChange > 0,
          'bg-red-500/20 text-red-500': countryData.percentageChange < 99
        }"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4 mr-1"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          @if (countryData.percentageChange < 0) {
            <!-- Flecha hacia abajo -->
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 13l-5-5m0 0l-5 5m5-5v12"
            />
          } @else {
            <!-- Flecha hacia arriba -->
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M7 11l5 5m0 0l5-5m-5 5V4"
            />
          }
        </svg>

        <p>{{ countryData.percentageChange | number: '1.2-2' }}%</p>
      </div>
    </div>

    <div>
      <img
        src="./images/value.webp"
        alt="svg"
        class="w-40  object-contain"
      />
    </div>
  </div>
</div>
